# dsh-main-agent bundle patch：当本包被列入 profile 的 dsh.profile.bundles 时，
# 它作为一个层被挂载（见 README —— `dsh plugin add`）。
#
# Rows（行）：
#   agi-supervisor-setup —— 本包自身的插件：开机时把随包提供的
#     `main-agent` preset 安装到 ${DSH_HOME:-~/.dsh}/.agent-presets/
#     （若不存在；config syncPreset: if-absent | always | never）。
#
# schedule 行（`agi-schedule`，`@deepseek-ai/dsh-schedule`）已拆到
# `patches/schedule.patch.yml`：那一层带自判定守卫 —— profile 已经从别处挂了
# schedule 服务时，本包这一行自动让位，不需要用户在 profile 里写 id 级
# `disabled: true`。schedule 服务每进程只注册一次，重复注册会抛
# `service "schedule" has been registered at <ScheduleService>`。
# （dsh-time-context 是刻意不挂载的：它会往每个请求注入一段逐步时间戳，
# 对本监督者而言纯属噪声 —— 它的定时器用的是相对时间 `after_seconds`，
# 而 Schedule 不依赖 time-context。）
- insert:
    - id: agi-supervisor-setup
      name: dsh-main-agent
