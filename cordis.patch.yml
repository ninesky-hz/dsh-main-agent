# dsh-main-agent bundle patch：当本包被列入 profile 的 dsh.profile.bundles 时，
# 它作为一个层被挂载（见 README —— `dsh plugin add`）。
#
# Rows（行）：
#   agi-supervisor-setup —— 本包自身的插件：开机时把随包提供的
#     `main-agent` preset 安装到 ${DSH_HOME:-~/.dsh}/.agent-presets/
#     （若不存在；config syncPreset: if-absent | always | never）。
#
# schedule 的 service（`@deepseek-ai/dsh-schedule`）由 host 平面提供 ——
# dsh-web-app 的 `- id: schedule` 行，每个挂了 Web GUI 的 profile 都有。
# 本包不再声明它：service 每进程只能注册一次，重复注册会抛
# `service "schedule" has been registered at <ScheduleService>`，那一行在插件页
# 显示成「异常」。曾经的 `!!js` 让位守卫挡不住这种情况 —— patch 求值时的
# `ctx.loader` 看不到排在别的 bundle 里的行，于是守卫恒为 false。
#
# 四个 reminder 工具（schedule_create / list / update / remove）改由
# main-agent preset 自己声明，与 `standard` / `cordis` / `ptc` 的做法一致。
# （dsh-time-context 是刻意不挂载的：它会往每个请求注入一段逐步时间戳，
# 对本监督者而言纯属噪声 —— 它的定时器用的是相对时间 `after_seconds`，
# 而 Schedule 不依赖 time-context。）
- insert:
    - id: agi-supervisor-setup
      name: dsh-main-agent
